# Production Nginx Configuration with Load Balancing & SSL Termination
# Domain: ssgpdashboard.in / www.ssgpdashboard.in
# File location: /etc/nginx/sites-available/siriempdashboard

upstream siri_backend_cluster {
    # Least-connection load balancing across multiple backend workers
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ssgpdashboard.in www.ssgpdashboard.in;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ssgpdashboard.in www.ssgpdashboard.in;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/ssgpdashboard.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssgpdashboard.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max upload size (allows high-resolution ornament photos & PDF slips)
    client_max_body_size 50M;

    # Frontend Static Distribution Directory
    root /var/www/siriempdashboard/siriempdashboard/frontend/dist;
    index index.html;

    # Gzip Compression for Optimal Web Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Media & Uploads Proxy
    location /uploads/ {
        alias /var/www/siriempdashboard/siriempdashboard/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /var/www/siriempdashboard/siriempdashboard/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Backend API Cluster Proxy
    location /api/ {
        proxy_pass http://siri_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long uploads and background processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Frontend SPA Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
